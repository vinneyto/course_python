[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["01_strings", "02_lists", "03_dictionaries", "04_sets", "05_iterators", "06_data_structures", "07_files", "08_concurrency", "09_asynchronous", "10_networking", "11_typing_and_metaprogramming"]

[tool.ruff]
target-version = "py311"
line-length = 100

