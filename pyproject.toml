[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["00_basics", "01_data_structures", "02_iterators", "03_files", "04_concurrency", "05_asynchronous", "06_networking", "07_typing_and_metaprogramming"]

[tool.ruff]
target-version = "py311"
line-length = 100

